<!doctype html>

<!-- Renders every Whop asset for the EZ Influencer Lab store (biz_EFva9rJXKAfThM).
     node content/storefront/render.mjs content/ez-influencer/kit.html content/ez-influencer/png
     Tokens mirror the design system (tokens.json). Copy only states what each live product page says. -->
<style>
  @font-face { font-family: "Bricolage Grotesque"; src: url(fonts/BricolageGrotesque-ExtraBold.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: "Figtree"; src: url(fonts/Figtree-Regular.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: "Figtree"; src: url(fonts/Figtree-SemiBold.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: "DM Mono"; src: url(fonts/DMMono-Medium.woff2) format("woff2"); font-weight: 500; }

  :root {
    --studio: #0e0b10;
    --studio-raised: #1a1419;
    --line: #33282f;
    --ink: #fbf1f4;
    --ink-muted: #b9a8b0;
    --flash: #ff3dbb;
    --flash-soft: #3a1030;
    --on-flash: #1c0714;
    --lock: #ffc94d;
    --peach: #ffb199;
    --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
    --body: "Figtree", system-ui, sans-serif;
    --mono: "DM Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #2a2a2a; font-family: var(--body); color: var(--ink); }
  section.panel { position: relative; overflow: hidden; background: var(--studio); margin: 0 0 40px; }

  /* shared studio atmosphere: ring-light glow + viewfinder corners + frame counter */
  .glow { position: absolute; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(255,61,187,.34), rgba(255,61,187,0) 62%); }
  .glow.gold { background: radial-gradient(circle, rgba(255,201,77,.16), rgba(255,201,77,0) 60%); }
  .vf { position: absolute; width: 64px; height: 64px; border-color: var(--ink-muted); border-style: solid; border-width: 0; opacity: .55; }
  .vf.tl { border-top-width: 4px; border-left-width: 4px; }
  .vf.tr { border-top-width: 4px; border-right-width: 4px; }
  .vf.bl { border-bottom-width: 4px; border-left-width: 4px; }
  .vf.br { border-bottom-width: 4px; border-right-width: 4px; }
  .counter { position: absolute; font: 500 22px/1 var(--mono); letter-spacing: .14em; color: var(--ink-muted); text-transform: uppercase; }
  .counter b { color: var(--flash); font-weight: 500; }
  .rec { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--flash); margin-right: 12px; vertical-align: 1px; }

  .eyebrow { font: 500 24px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-muted); }
  .eyebrow b { color: var(--lock); font-weight: 500; }
  h2 { font-family: var(--display); font-weight: 800; letter-spacing: -.03em; margin: 0; text-wrap: balance; }
  h2 em { font-style: normal; color: var(--flash); }
  .chip { display: inline-flex; align-items: center; gap: 12px; padding: 14px 26px; border-radius: 999px;
    border: 2px solid var(--line); background: var(--studio-raised); font: 600 28px/1 var(--body); color: var(--ink); }
  .chip.hot { background: var(--flash); border-color: var(--flash); color: var(--on-flash); }
  .chip.gold { border-color: var(--lock); color: var(--lock); background: transparent; }
  .chips { display: flex; flex-wrap: wrap; gap: 16px; }

  /* glyph tile */
  .tile { position: absolute; border-radius: 48px; background: var(--studio-raised); border: 3px solid var(--line);
    display: grid; place-items: center; box-shadow: 0 0 120px rgba(255,61,187,.25); }
  .tile svg { width: 58%; height: 58%; overflow: visible; }
  .g { fill: none; stroke: var(--flash); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
  .g2 { fill: none; stroke: var(--lock); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
  .gf { fill: var(--lock); }
  .badge { position: absolute; font: 500 22px/1 var(--mono); letter-spacing: .14em; background: var(--lock); color: #1c1400;
    padding: 10px 16px; border-radius: 8px; }

  /* card: 1920x1080, bottom 46% kept dark for Whop's white title overlay */
  .card { width: 1920px; height: 1080px; }
  .card .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 46%;
    background: linear-gradient(to bottom, rgba(14,11,16,0), rgba(14,11,16,.94) 34%, var(--studio)); }
  .card .hook { position: absolute; left: 120px; top: 150px; width: 1060px; }
  .card .hook h2 { font-size: 112px; line-height: .98; margin-top: 26px; }
  .card .tile { right: 150px; top: 120px; width: 460px; height: 460px; }

  /* icon: 1024 */
  .icon { width: 1024px; height: 1024px; }
  .icon .tile { inset: 112px; width: auto; height: auto; border-radius: 120px; }

  /* gallery: 1920x1080 headline + bullets + chips */
  .gallery { width: 1920px; height: 1080px; }
  .gallery .copy { position: absolute; left: 120px; top: 130px; width: 1080px; display: flex; flex-direction: column; gap: 34px; }
  .gallery h2 { font-size: 96px; line-height: 1; }
  .gallery .lede { font: 400 34px/1.45 var(--body); color: var(--ink-muted); margin: 0; max-width: 980px; }
  .gallery ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 18px; }
  .gallery li { font: 400 32px/1.35 var(--body); padding-left: 44px; position: relative; }
  .gallery li::before { content: ""; position: absolute; left: 0; top: 12px; width: 18px; height: 18px; border: 4px solid var(--flash); border-radius: 4px; }
  .gallery .tile { right: 150px; top: 250px; width: 480px; height: 480px; }
  .gallery .note { position: absolute; left: 120px; bottom: 70px; font: 500 22px/1.4 var(--mono); letter-spacing: .08em; color: var(--ink-muted); }

  /* store banner / avatar / social */
  .banner { width: 1920px; height: 1080px; }
  .avatar { width: 1024px; height: 1024px; display: grid; place-items: center; }
  .social { width: 1200px; height: 630px; }
  .mark { font-family: var(--display); font-weight: 800; letter-spacing: -.05em; line-height: .8; color: var(--ink); }
  .mark i { font-style: normal; color: var(--flash); }

  /* tiers + steps */
  .tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 36px; position: absolute; left: 120px; right: 120px; top: 360px; }
  .tier { background: var(--studio-raised); border: 3px solid var(--line); border-radius: 28px; padding: 44px 44px 48px; display: flex; flex-direction: column; gap: 22px; min-height: 520px; }
  .tier.open { border-color: var(--flash); box-shadow: 0 0 80px rgba(255,61,187,.22); }
  .tier .name { font: 800 60px/1 var(--display); letter-spacing: -.02em; }
  .tier .price { font: 800 88px/1 var(--display); letter-spacing: -.03em; color: var(--flash); }
  .tier .price small { font: 600 30px/1 var(--body); color: var(--ink-muted); letter-spacing: 0; }
  .tier p { margin: 0; font: 400 30px/1.4 var(--body); color: var(--ink-muted); }
  .tier .chip { align-self: flex-start; margin-top: auto; }
  .steps { position: absolute; left: 120px; right: 120px; top: 380px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 26px; }
  .step { border-top: 4px solid var(--line); padding-top: 30px; display: flex; flex-direction: column; gap: 18px; }
  .step .n { font: 500 26px/1 var(--mono); letter-spacing: .14em; color: var(--flash); }
  .step .t { font: 800 44px/1.02 var(--display); letter-spacing: -.02em; }
  .step p { margin: 0; font: 400 26px/1.4 var(--body); color: var(--ink-muted); }
  .step.lock { border-top-color: var(--lock); }
  .step.lock .n { color: var(--lock); }
</style>
</head>
<body>
<div id="out"></div>
<script>
const G = {

    bullets: ['Browse the persona catalog and community', 'Deploy a persona agent by adding Ops + a pack license', 'Start with the Folana pack'],
    chips: [['Early members', 'gold']] },
  { slug: 'ops-membership', n: '03', glyph: 'ops', eyebrow: 'Ops Membership',

  { slug: 'hosted-agent-seat', n: '04', glyph: 'seat', eyebrow: 'Hosted Agent Seat',

  { slug: 'ai-music-starter-pack', n: '08', glyph: 'note', eyebrow: 'AI Music Starter Pack',

  { slug: 'folana-inner-circle', n: '11', glyph: 'mic', eyebrow: 'Folana · <b>AI artist</b>', badge: 'AI ARTIST',

  <div style="position:absolute;left:120px;top:120px;display:flex;flex-direction:column;gap:24px">

html += `<section class="panel gallery" id="gallery-ez-influencer-lab-how">${atmos(1920, 1080, '01')}

document.getElementById('out').innerHTML = html;
</script>
</body>
</html>
