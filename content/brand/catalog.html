<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mad EZ Media Product Catalog Assets</title>
<!--
  Every Mad EZ Media Whop product gets three assets from one data table (PRODUCTS below):
    card-<slug>.png     1920x1080  store-grid card. Whop overlays the product NAME in white at the
                                   bottom-left and shows the price under the card, so the art keeps
                                   that zone dark and never repeats name or price.
    icon-<slug>.png     1024x1024  product icon / thumbnail
    gallery-<slug>.png  1920x1080  first gallery image: headline + price + what you get
  Two lines, one family: BUILDER (orange→red) and CREATOR (magenta→violet), same black/grid/type.
  Claims come only from each product's live Whop page. Folana is always labelled an AI artist.
  Render: node content/storefront/render.mjs content/brand/catalog.html content/brand/png/catalog
-->
<style>
  :root { --bg:#07070a; --panel:#111117; --line:#2a2a33; --text:#f4f4f7; --muted:#a6a6b0; }
  .builder { --a1:#ff5a1f; --a2:#ff2d55; --glow:rgba(255,90,31,.42); }
  .creator { --a1:#ff3dbb; --a2:#8b5cff; --glow:rgba(190,70,255,.40); }
  * { box-sizing: border-box; margin: 0; }
  body { background:#222; font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color: var(--text); }
  .panel { position: relative; overflow: hidden; margin-bottom: 40px;
    background: radial-gradient(60% 65% at 78% 22%, color-mix(in srgb, var(--a1) 30%, transparent), transparent 70%),
                radial-gradient(45% 55% at 5% 100%, color-mix(in srgb, var(--a2) 22%, transparent), transparent 70%), var(--bg); }
  .panel::before { content:""; position:absolute; inset:0; pointer-events:none;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px), linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size: 60px 60px; mask-image: radial-gradient(80% 80% at 60% 35%,#000 35%,transparent 100%); }
  .panel > * { position: relative; }
  .hot { background: linear-gradient(90deg,var(--a1),var(--a2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .eyebrow { font-size: 26px; font-weight: 800; letter-spacing: .2em; color: var(--muted); text-transform: uppercase; }
  .tile { border-radius: 26%; background: var(--panel); border: 6px solid transparent; display: grid; place-items: center;
    background-image: linear-gradient(var(--panel), var(--panel)), linear-gradient(135deg, var(--a1), var(--a2));
    background-origin: border-box; background-clip: padding-box, border-box; box-shadow: 0 0 90px var(--glow); }
  .chip { border: 2px solid var(--line); background: rgba(17,17,23,.85); border-radius: 999px; padding: 12px 24px; font-size: 26px; font-weight: 700; }
  .chip.p { border-color: var(--a1); color: var(--a1); }
  .badge { position:absolute; border-radius: 999px; padding: 10px 22px; font-weight: 900; letter-spacing: .12em;
    background: linear-gradient(90deg,var(--a1),var(--a2)); color:#0b0b0f; box-shadow: 0 0 30px var(--glow); }

  /* CARD: art up top, bottom 42% kept dark for Whop's white title overlay */
  .card { width:1920px; height:1080px; }
  .card::after { content:""; position:absolute; left:0; right:0; bottom:0; height:46%;
    background: linear-gradient(to top, rgba(7,7,10,.96) 35%, rgba(7,7,10,0)); }
  .card .hook { position:absolute; left:120px; top:110px; width:1080px; z-index:1; }
  .card .hook h2 { font-size: 112px; line-height: 1.03; font-weight: 850; letter-spacing: -.03em; margin-top: 22px; }
  .card .art { position:absolute; right:170px; top:110px; z-index:1; }
  .card .art .tile { width: 470px; height: 470px; }

  .icon { width:1024px; height:1024px; display:grid; place-items:center; }
  .icon .tile { width: 760px; height: 760px; }

  .gallery { width:1920px; height:1080px; padding: 0 150px; display:flex; align-items:center; justify-content:space-between; gap:80px; }
  .gallery h1 { font-size: 96px; line-height:1.03; font-weight:850; letter-spacing:-.03em; margin: 24px 0 26px; }
  .gallery .sub { font-size: 34px; color: var(--muted); line-height:1.4; max-width: 980px; }
  .gallery .row { display:flex; gap:16px; flex-wrap:wrap; margin-top: 44px; }
  .gallery .tile { width: 440px; height: 440px; flex: none; }
  svg.g { overflow: visible; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gB" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="200"><stop offset="0" stop-color="#ff5a1f"/><stop offset="1" stop-color="#ff2d55"/></linearGradient>
  <linearGradient id="gC" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="200"><stop offset="0" stop-color="#ff3dbb"/><stop offset="1" stop-color="#8b5cff"/></linearGradient>
  <filter id="gl" filterUnits="userSpaceOnUse" x="-20" y="-20" width="240" height="240"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs></svg>

<div id="out"></div>

<script>
// Glyphs draw with stroke/fill = G (the line's gradient id). Simple shapes that read at 40px.
const GLYPHS = {
  lab: (G) => `<g fill="none" stroke="url(#${G})" stroke-width="12" stroke-linecap="round" filter="url(#gl)">
      <line x1="100" y1="40" x2="45" y2="95"/><line x1="100" y1="40" x2="155" y2="95"/><line x1="45" y1="105" x2="100" y2="160"/><line x1="155" y1="105" x2="100" y2="160"/><line x1="100" y1="40" x2="100" y2="160"/></g>
    <g fill="url(#${G})"><circle cx="100" cy="36" r="18"/><circle cx="42" cy="100" r="16"/><circle cx="158" cy="100" r="16"/><circle cx="100" cy="164" r="24"/></g>`,
  kit: (G) => `<g fill="none" stroke="url(#${G})" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" filter="url(#gl)">
      <path d="M30 90 L100 120 L170 90 L170 160 L100 190 L30 160 Z"/><path d="M100 120 L100 190"/><path d="M30 90 L55 62 M170 90 L145 62"/><line x1="100" y1="72" x2="100" y2="100"/></g>
    <circle cx="100" cy="46" r="22" fill="url(#${G})"/>`,
  tool: (G) => `<circle cx="100" cy="100" r="72" fill="none" stroke="url(#${G})" stroke-width="12" stroke-dasharray="28 16" filter="url(#gl)"/>
    <path d="M110 40 L64 110 L96 110 L86 162 L136 88 L104 88 Z" fill="url(#${G})" filter="url(#gl)"/>`,
  vibe: (G) => `<g fill="none" stroke="url(#${G})" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)">
      <path d="M68 60 L28 100 L68 140"/><path d="M132 60 L172 100 L132 140"/><path d="M114 44 L86 156"/></g>`,
  creator: (G) => `<g fill="none" stroke="url(#${G})" stroke-width="12" stroke-linejoin="round" filter="url(#gl)">
      <rect x="22" y="48" width="156" height="104" rx="22"/></g>
    <path d="M86 76 L128 100 L86 124 Z" fill="url(#${G})" filter="url(#gl)"/>
    <g fill="url(#${G})"><circle cx="46" cy="176" r="8"/><circle cx="100" cy="176" r="8"/><circle cx="154" cy="176" r="8"/></g>`,
  music: (G) => `<g fill="none" stroke="url(#${G})" stroke-width="12" stroke-linecap="round" filter="url(#gl)">
      <path d="M78 150 L78 52 L150 36 L150 134"/></g>
    <g fill="url(#${G})" filter="url(#gl)"><ellipse cx="60" cy="152" rx="24" ry="18"/><ellipse cx="132" cy="136" rx="24" ry="18"/></g>`,
  image: (G) => `<g fill="none" stroke="url(#${G})" stroke-width="12" stroke-linejoin="round" filter="url(#gl)">
      <rect x="26" y="38" width="148" height="124" rx="20"/><path d="M36 148 L84 100 L118 132 L140 110 L166 138"/></g>
    <path d="M142 58 L148 74 L164 80 L148 86 L142 102 L136 86 L120 80 L136 74 Z" fill="url(#${G})" filter="url(#gl)"/>`,
};

// Facts from each product's live Whop page (2026-09-26/27). Hooks/headlines are ours; prices/claims are theirs.
const PRODUCTS = [
  { slug:"ai-agent-lab", line:"builder", glyph:"lab", eyebrow:"Mad EZ Media · AI Agent Lab",
    hook:`Build an AI agent team that <span class="hot">remembers.</span>`,
    head:`Your AI agents, working as <span class="hot">one team.</span>`,
    sub:"Weekly agent builds + skill drops. Your first agent in about 30 minutes.",
    chips:["$1 for 3 days · then $39/mo","7-day money-back guarantee","Starter Kit files included"] },
  { slug:"starter-kit", line:"builder", glyph:"kit", eyebrow:"Mad EZ Media · Starter Kit",
    hook:`Make your AI agents <span class="hot">remember each other.</span>`,
    head:`43 files. <span class="hot">One agent fleet.</span>`,
    sub:"10 agent profiles, a React dashboard, automation templates and Redis deploy scripts. Instant download.",
    chips:["$47 one-time","Also included in AI Agent Lab"] },
  { slug:"automation-toolkit", line:"builder", glyph:"tool", eyebrow:"Mad EZ Media · Free toolkit",
    hook:`Automate the busywork <span class="hot">with AI.</span>`,
    head:`AI workflow automation, <span class="hot">free.</span>`,
    sub:"A free AI workflow automation toolkit for entrepreneurs, marketers and creators.",
    chips:["Free","Next step: AI Agent Lab"] },
  { slug:"vibe-coding", line:"builder", glyph:"vibe", eyebrow:"Mad EZ Media · Community",
    hook:`Ship faster with <span class="hot">vibe coding.</span>`,
    head:`Meet fellow <span class="hot">vibe coders.</span>`,
    sub:"Get the latest updates, tips and tricks for building with AI coding tools.",
    chips:["Community","Next step: AI Agent Lab"] },
  { slug:"creator-360", line:"creator", glyph:"creator", eyebrow:"EZ Influencer · Creator 360",
    hook:`Your AI-powered <span class="hot">content factory.</span>`,
    head:`An AI influencer <span class="hot">content factory.</span>`,
    sub:"AI-powered content production for creators on Fanvue.",
    chips:["$100/mo","7-day free trial"] },
  { slug:"folana-inner-circle", line:"creator", glyph:"music", eyebrow:"Folana · AI artist", badge:"AI ARTIST",
    hook:`Early access to <span class="hot">Folana's world.</span>`,
    head:`Music, art & community from <span class="hot">an AI artist.</span>`,
    sub:"Folana is an AI artist created by Mad EZ Media. Weekly music previews, exclusive visual art, monthly listening parties and AI-generated voice notes.",
    chips:["$7/mo","3-day trial"] },
  { slug:"image-gen-tools", line:"creator", glyph:"image", eyebrow:"Mad EZ Media · Free tools",
    hook:`AI image generation, <span class="hot">made easy.</span>`,
    head:`Free AI <span class="hot">image generation tools.</span>`,
    sub:"Image generation tools from Mad EZ Media, free to join.",
    chips:["Free","Next step: Creator 360"] },
];

const G = (p) => p.line === "builder" ? "gB" : "gC";
const glyph = (p, size) => `<svg class="g" viewBox="0 0 200 200" width="${size}" height="${size}">${GLYPHS[p.glyph](G(p))}</svg>`;
const badge = (p, style) => p.badge ? `<span class="badge" style="${style}">${p.badge}</span>` : "";
const out = document.getElementById("out");
const add = (html) => out.insertAdjacentHTML("beforeend", html);

for (const p of PRODUCTS) {
  add(`<section class="panel card ${p.line}" id="card-${p.slug}">
    <div class="hook"><div class="eyebrow">${p.eyebrow}</div><h2>${p.hook}</h2></div>
    <div class="art"><div class="tile">${glyph(p, 300)}</div>${badge(p, "right:-20px;top:-18px;font-size:30px")}</div>
  </section>`);
  add(`<section class="panel icon ${p.line}" id="icon-${p.slug}"><div class="tile">${glyph(p, 480)}</div>${badge(p, "right:120px;top:120px;font-size:40px")}</section>`);
  add(`<section class="panel gallery ${p.line}" id="gallery-${p.slug}">
    <div><div class="eyebrow">${p.eyebrow}</div><h1>${p.head}</h1><p class="sub">${p.sub}</p>
      <div class="row">${p.chips.map((c, i) => `<span class="chip${i === 0 ? " p" : ""}">${c}</span>`).join("")}</div></div>
    <div style="position:relative"><div class="tile">${glyph(p, 290)}</div>${badge(p, "right:-16px;top:-16px;font-size:28px")}</div>
  </section>`);
}
</script>
</body>
</html>
